<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0BC5EA"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0BC5EA" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0BC5EA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="40" y="40" width="1120" height="220" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <circle cx="90" cy="60" r="140" fill="url(#glowCyan)" filter="url(#softBlur)"/>
  <circle cx="1130" cy="260" r="150" fill="url(#glowPurple)" filter="url(#softBlur)"/>
  <text x="960" y="230" font-family="Georgia, serif" font-size="150" fill="#6366F1" opacity="0.10">&lt;/&gt;</text>

  <rect x="40" y="40" width="1120" height="220" rx="16" fill="#1e1e2e" stroke="url(#borderGrad)" stroke-width="2" filter="url(#cardShadow)"/>

  <g clip-path="url(#cardClip)">
    <rect x="40" y="40" width="1120" height="34" fill="#282a3a"/>
    <circle cx="64" cy="57" r="6" fill="#ff5f56"/>
    <circle cx="84" cy="57" r="6" fill="#ffbd2e"/>
    <circle cx="104" cy="57" r="6" fill="#27c93f"/>
    <text x="130" y="62" font-family="Consolas, Menlo, monospace" font-size="13" fill="#a5b4fc">poovalingam@dev:~</text>

    <text xml:space="preserve" x="64" y="104" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="21" fill="#f8f8f2">
      <tspan x="64" dy="0"><tspan fill="#50fa7b">$</tspan> whoami</tspan>
      <tspan x="64" dy="34"><tspan fill="#8be9fd">Poovalingam M</tspan><tspan fill="#a5b4fc"> — Java Full Stack Developer</tspan></tspan>
      <tspan x="64" dy="34"><tspan fill="#50fa7b">$</tspan> echo $FOCUS</tspan>
      <tspan x="64" dy="34"><tspan fill="#ff79c6">Spring Boot</tspan><tspan fill="#a5b4fc"> · </tspan><tspan fill="#ff79c6">React.js</tspan><tspan fill="#a5b4fc"> · </tspan><tspan fill="#ff79c6">Blockchain</tspan></tspan>
      <tspan x="64" dy="34"><tspan fill="#50fa7b">$</tspan><tspan fill="#f8f8f2"> _</tspan></tspan>
    </text>
  </g>
</svg>
